# Builds the MSI installers and publishes a GitHub release when a version tag is pushed:
#   1. set <Version> in Directory.Build.props (e.g. 0.2.0)
#   2. git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Build MSI installers (en-US, bg-BG)
        run: dotnet build installer -c Release

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($culture in 'en-US', 'bg-BG') {
            Copy-Item "installer/bin/Release/$culture/DelayStart-$env:VERSION.msi" "dist/DelayStart-$env:VERSION-$culture.msi"
          }
          Get-ChildItem dist/*.msi | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "DelayStart ${{ github.ref_name }}" --generate-notes
